name: Refresh data

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay or drop runs at the top of the hour. Try at 6:23 PM, 8:23 PM,
    # and 11:23 PM Malaysia time on weekdays; skip if today's post-close data is already published.
    - cron: '23 10 * * 1-5'
    - cron: '23 12 * * 1-5'
    - cron: '23 15 * * 1-5'

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.snapshot.outputs.run }}
    steps:
      - name: Check out the current snapshot pointer from main
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: /data/snapshot.json
          sparse-checkout-cone-mode: false
      - name: Check for today's post-close snapshot
        id: snapshot
        shell: bash
        env:
          TZ: Asia/Kuala_Lumpur
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]] &&
             published_at=$(jq -er '.publishedAt | select(type == "string" and length > 0)' data/snapshot.json) &&
             published_epoch=$(date -d "$published_at" +%s) &&
             (( published_epoch >= $(date -d 'today 17:00' +%s) && published_epoch < $(date -d 'tomorrow 00:00' +%s) )); then
            echo 'A snapshot was already published after Bursa closed today.'
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BURSA_SQLITE_PATH: ${{ github.workspace }}/data/sqlite/research.db
      BURSA_SNAPSHOT_READONLY: '0'
      VERCEL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci 2>&1 | tee refresh.log
      - name: Fetch and verify published snapshot
        run: npm run snapshot:fetch 2>&1 | tee -a refresh.log
      - name: Unpack published snapshot
        run: |
          mkdir -p data/sqlite
          gzip -dc data/snapshots/research.db.gz > "$BURSA_SQLITE_PATH"
          echo "REFRESH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          touch refresh.log
      - name: Download prices and accounts; calculate fair value
        run: npm run refresh:daily -- --skip-rescore 2>&1 | tee -a refresh.log
      - name: Re-score and publish universe results
        run: npm run market:rescore 2>&1 | tee -a refresh.log
      - name: Validate refresh results
        run: npx tsx scripts/validate-refresh.ts 2>&1 | tee -a refresh.log
      - name: Pack and validate snapshot
        run: npm run snapshot:pack -- --dest data/snapshots/research.db.gz --write-production 2>&1 | tee -a refresh.log
      - name: Publish snapshot data
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          snapshot_commit=$(bash scripts/publish-snapshot-data.sh 2> >(tee -a refresh.log >&2))
          echo "SNAPSHOT_COMMIT=$snapshot_commit" >> "$GITHUB_ENV"
          echo "Published snapshot data: $snapshot_commit" | tee -a refresh.log
      - name: Commit and push snapshot pointer
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          npx tsx scripts/write-snapshot-pointer.ts "$SNAPSHOT_COMMIT" 2>&1 | tee -a refresh.log
          git add data/snapshot.json
          git commit -m "data: refresh snapshot as of $(date -u +%Y-%m-%d)" 2>&1 | tee -a refresh.log
          git push origin HEAD:main 2>&1 | tee -a refresh.log
      - name: Upload refresh log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log-${{ github.run_id }}
          path: refresh.log
          if-no-files-found: warn
          retention-days: 30
