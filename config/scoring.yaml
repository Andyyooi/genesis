# Editable evidence-model settings. Percentile ranks replace fixed score anchors.
version: 2
currency: MYR
top_picks:
  min_market_cap: 2000000000
  min_median_traded_value: 1000000
  quality_tilt_weights:
    valuation: 15
    quality: 35
    momentum: 20
    low_volatility: 15
    financial_health: 10
    growth: 5
# Ordinary-company category weights (must sum to 100).
category_weights:
  valuation: 30
  quality: 25
  momentum: 20
  low_volatility: 10
  financial_health: 10
  growth: 5
# Annual accounts are usable at known available_at, else FY end plus this lag.
reporting_lag_months: 4
growth_years: 3
consistency:
  # Revenue jump/drop guard when PAT stays within the tolerance below.
  revenue_break_ratio: 0.5
  pat_stability_tolerance: 0.25
  eps_scale_tolerance: 3
ranking:
  sector_min_names: 8
  sector_blend: 0.5
eligibility:
  min_median_traded_value: 100000
  min_price_days: 200
  min_coverage: 0.5
unavailable_until_data: []
min_category_coverage: 0.5
confidence:
  high_coverage: 0.8
  medium_coverage: 0.5
  high_max_age_months: 18
  medium_max_age_months: 30
research_profile_rules:
  bank_industry_includes: [banks]
  other_financial_industry_includes: [insurance, takaful, asset management, capital markets, credit services, financial data, stock exchanges]
  bank_tickers: [MAYBANK, CIMB, PBBANK, HLBANK, RHBBANK]
alerts:
  score_delta: 15
  price_move_1d: 0.05
  price_move_5d: 0.08
  health_delta: 8
  publication:
    score_eligible_only: true # Current eligible names, plus current/previous top picks.
    exclusions_top_picks_only: true # Other exclusions matter only for top picks.
    important_exclusions: [warning] # Normalized keys: warning, liquidity, price_history, coverage.
    priority: [new_exclusion_reason, top_pick_left, top_pick_entered, fair_value_safety_changed, research_score_down, research_score_up]
    max_per_type: # Largest score moves first; warning exclusions before other exclusions.
      new_exclusion_reason: 5
      top_pick_left: 15
      top_pick_entered: 15
      fair_value_safety_changed: 5
      research_score_down: 5
      research_score_up: 5
concerns:
  apply_score_penalty: false
  rules:
    - {id: pn17, label: PN17 warning, message: Stored PN17 warning flag., when: instrument_pn17}
    - {id: falling_revenue, label: Falling revenue, message: Fixed-window revenue CAGR is negative., metric: revenue_cagr, when: value_lt, threshold: 0}
    - {id: negative_ocf, label: Negative operating cash flow, message: Stored annual operating cash flow is negative., metric: ocf, when: value_lt, threshold: 0}
instrument_profiles:
  default:
    description: "Ordinary companies: value, profitability, price trends and balance-sheet resilience."
    factor_sets:
      valuation:
        - {id: earnings_yield, metric: earnings_yield, label: "Earnings yield", weight: 40, direction: higher_better, explanation: "Annual PAT / market capitalisation. Losses stay negative; conflicting reported EPS is never substituted."}
        - {id: book_to_price, metric: book_to_price, label: "Book-to-price", weight: 30, direction: higher_better, explanation: "Book equity per ringgit of market value. Higher means a lower price relative to accounting equity."}
        - {id: ebit_ev, metric: ebit_ev, label: "EBIT / enterprise value", weight: 25, direction: higher_better, explanation: "Operating earnings relative to the value of equity plus debt less cash. Compares operating earning power across capital structures."}
        - {id: dividend_yield, metric: dividend_yield, label: "Dividend yield", weight: 5, direction: higher_better, explanation: "Annual cash dividend per share divided by price. Captures distributions, not a promise of future income."}
      quality:
        - {id: roe, metric: roe, label: "Return on equity", weight: 40, direction: higher_better, explanation: "Annual profit divided by book equity. Measures profitability of shareholders' capital."}
        - {id: gross_profitability, metric: gross_profitability, label: "Gross profitability", weight: 30, direction: higher_better, explanation: "Gross profit divided by total assets. Measures how productively assets generate gross profit."}
        - {id: piotroski, metric: piotroski, label: "Piotroski F-score", weight: 30, direction: higher_better, explanation: "Nine profitability, cash flow, leverage, liquidity and operating-efficiency checks. At least six must be computable; points are scaled to nine."}
      financial_health:
        - {id: debt_to_equity, metric: debt_to_equity, label: "Debt / equity", weight: 40, direction: lower_better, explanation: "Debt relative to book equity. Lower debt can mean more balance-sheet resilience."}
        - {id: net_debt_to_ebitda, metric: net_debt_to_ebitda, label: "Net debt / EBITDA", weight: 30, direction: lower_better, explanation: "Debt less cash relative to EBITDA. Lower means less leverage against operating earnings."}
        - {id: interest_coverage, metric: interest_coverage, label: "Interest coverage", weight: 30, direction: higher_better, explanation: "EBIT divided by interest expense. Higher indicates more earnings available to meet interest payments."}
      growth:
        - {id: revenue_cagr, metric: revenue_cagr, label: "Revenue CAGR", weight: 50, direction: higher_better, explanation: "Annualised revenue growth over the configured fixed fiscal-year window. Both endpoint annuals are required."}
        - {id: eps_cagr, metric: eps_cagr, label: "EPS CAGR", weight: 50, direction: higher_better, explanation: "Annualised earnings-per-share growth over the configured fixed window. Requires positive starting EPS and a nonnegative endpoint."}
      momentum:
        - {id: momentum_12_1, metric: momentum_12_1, label: "12–1 month momentum", weight: 100, direction: higher_better, explanation: "Price return from trading day t−252 to t−21, skipping the latest month to reduce short-term reversal effects. Uses adjusted prices when the full window is available."}
      low_volatility:
        - {id: volatility_252, metric: volatility_252, label: "Annualised daily volatility", weight: 100, direction: lower_better, explanation: "Sample standard deviation of 252 daily returns multiplied by the square root of 252. Lower means a smoother historical price path, not guaranteed safety."}
  bank:
    description: "Banks ranked only against banks; no industrial debt or cash-flow health model."
    # Editable profile-specific weights (must sum to 100).
    category_weights:
      valuation: 35
      quality: 25
      financial_health: 0
      growth: 5
      momentum: 20
      low_volatility: 15
    factor_sets:
      valuation:
        - {id: book_to_price, metric: book_to_price, label: "Book-to-price", weight: 50, direction: higher_better, explanation: "Book equity per ringgit of market value. Compares bank equity valuation."}
        - {id: earnings_yield, metric: earnings_yield, label: "Earnings yield", weight: 40, direction: higher_better, explanation: "Annual PAT / market capitalisation. Measures bank earnings per ringgit invested; losses remain negative."}
        - {id: dividend_yield, metric: dividend_yield, label: "Dividend yield", weight: 10, direction: higher_better, explanation: "Annual distributions per share divided by price. Measures cash income from the bank."}
      quality:
        - {id: roe, metric: roe, label: "Return on equity", weight: 100, direction: higher_better, explanation: "Annual profit divided by equity. Measures the bank's profitability on shareholder capital."}
      financial_health: []
      growth:
        - {id: revenue_cagr, metric: revenue_cagr, label: "Revenue CAGR", weight: 50, direction: higher_better, explanation: "Annualised revenue growth between the fixed-window annual endpoints."}
        - {id: eps_cagr, metric: eps_cagr, label: "EPS CAGR", weight: 50, direction: higher_better, explanation: "Annualised EPS growth between the fixed-window annual endpoints."}
      momentum:
        - {id: momentum_12_1, metric: momentum_12_1, label: "12–1 month momentum", weight: 100, direction: higher_better, explanation: "Price return from trading day t−252 to t−21, skipping the latest month to reduce short-term reversal effects. Uses adjusted prices when the full window is available."}
      low_volatility:
        - {id: volatility_252, metric: volatility_252, label: "Annualised daily volatility", weight: 100, direction: lower_better, explanation: "Sample standard deviation of 252 daily returns multiplied by the square root of 252. Lower means a smoother historical price path, not guaranteed safety."}
  reit:
    description: "REITs ranked only against REITs; distributions, NAV, gearing and price evidence."
    # Editable profile-specific weights (must sum to 100).
    category_weights:
      valuation: 35
      quality: 0
      financial_health: 20
      growth: 10
      momentum: 20
      low_volatility: 15
    factor_sets:
      valuation:
        - {id: distribution_yield, metric: dividend_yield, label: "Distribution yield", weight: 60, direction: higher_better, explanation: "Annual distribution per unit divided by unit price. Measures cash distributions relative to price."}
        - {id: nav_to_price, metric: nav_to_price, label: "NAV / price", weight: 40, direction: higher_better, explanation: "Reported NAV per unit divided by price, or book equity per unit if reported NAV is absent. Higher indicates a larger NAV discount."}
      quality: []
      financial_health:
        - {id: reit_gearing, metric: reit_gearing, label: "REIT gearing", weight: 100, direction: lower_better, explanation: "Total debt divided by total assets. Lower gearing provides more balance-sheet headroom."}
      growth:
        - {id: dpu_cagr, metric: dpu_cagr, label: "DPU CAGR", weight: 100, direction: higher_better, explanation: "Annualised distribution-per-unit growth over the configured fixed fiscal-year window. Both endpoints are required."}
      momentum:
        - {id: momentum_12_1, metric: momentum_12_1, label: "12–1 month momentum", weight: 100, direction: higher_better, explanation: "Price return from trading day t−252 to t−21, skipping the latest month to reduce short-term reversal effects. Uses adjusted prices when the full window is available."}
      low_volatility:
        - {id: volatility_252, metric: volatility_252, label: "Annualised daily volatility", weight: 100, direction: lower_better, explanation: "Sample standard deviation of 252 daily returns multiplied by the square root of 252. Lower means a smoother historical price path, not guaranteed safety."}
